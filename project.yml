name: FourEight
options:
  bundleIdPrefix: com.waylake
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SajuKit:
    path: SajuKit
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.3
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0

targets:
  FourEight:
    type: application
    platform: macOS
    sources:
      - App/FourEight
    dependencies:
      - package: SajuKit
      - package: MLXSwiftLM
        products: [MLXLLM, MLXLMCommon, MLXHuggingFace]
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    entitlements:
      path: App/FourEight.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FourEight
        # 빌드 설정에서 주입한다. 릴리스 워크플로가 태그에서 값을 계산해
        # xcodebuild에 넘긴다. 자세한 규칙은 docs/release.md 참고.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.lifestyle
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "© 2026 waylake. MIT License."
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: false
    settings:
      base:
        # 로컬 개발 기본값. 릴리스 빌드는 xcodebuild 인자로 덮어쓴다.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        DEAD_CODE_STRIPPING: true

schemes:
  FourEight:
    build:
      targets:
        FourEight: all
    run:
      config: Debug
    test:
      config: Debug
