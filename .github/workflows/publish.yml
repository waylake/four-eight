name: Publish

# 릴리스를 발행하는 행위가 appcast를 살리는 신호다.
#
# 태그를 밀면 빌드와 초안 릴리스까지만 간다. 사람이 내려받아 실제로
# 실행해 보고 발행 버튼을 눌러야 업데이트가 전 사용자에게 알려진다.
# 1인 프로젝트에는 이 관문이 더 필요하다. 잘못 나간 항목을 되돌릴
# 방법이 없기 때문이다 — appcast는 append-only다.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "appcast를 살릴 태그 (예: v0.1.0)"
        required: true

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  promote:
    name: appcast 커밋
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 태그가 아니라 main을 본다. 여기서 appcast를 커밋하므로 태그
          # 커밋을 체크아웃한 채로 밀면 main을 되감을 위험이 있다.
          ref: main

      - name: 대상 태그 확인
        id: target
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          [ -n "$TAG" ] || { echo "태그를 결정할 수 없습니다"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 스테이징 appcast 가져오기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 이 태그를 만든 Release 워크플로 실행에서 산출물을 찾는다.
          RUN=$(gh run list --workflow Release --json databaseId,headBranch,conclusion \
                  --limit 40 \
                  --jq "[.[] | select(.headBranch==\"${{ steps.target.outputs.tag }}\" and .conclusion==\"success\")][0].databaseId")
          [ -n "$RUN" ] && [ "$RUN" != "null" ] || {
            echo "::error::${{ steps.target.outputs.tag }}에 해당하는 성공한 Release 실행을 찾지 못했습니다."
            exit 1
          }
          gh run download "$RUN" --name appcast-staged --dir staged
          test -s staged/appcast.xml || { echo "::error::스테이징 appcast가 비었습니다"; exit 1; }

      - name: 발행 전 검증
        run: |
          # 이 태그의 항목이 실제로 들어 있는지, 그리고 그 항목이 가리키는
          # 자산이 릴리스에 존재하는지 확인한다.
          VERSION="${{ steps.target.outputs.tag }}"
          VERSION="${VERSION#v}"
          grep -q "<sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>" staged/appcast.xml || {
            echo "::error::appcast에 ${VERSION} 항목이 없습니다"; exit 1; }

          URL=$(grep -o 'url="[^"]*'"${{ steps.target.outputs.tag }}"'/FourEight.zip"' staged/appcast.xml | head -1 | sed 's/url="//;s/"$//')
          [ -n "$URL" ] || { echo "::error::enclosure URL을 찾지 못했습니다"; exit 1; }
          CODE=$(curl -sL -o /dev/null -w '%{http_code}' "$URL")
          [ "$CODE" = "200" ] || { echo "::error::자산에 접근할 수 없습니다 ($CODE): $URL"; exit 1; }
          echo "검증 통과: $URL"

      - name: appcast를 저장소에 커밋
        run: |
          cp staged/appcast.xml appcast.xml
          if git diff --quiet appcast.xml; then
            echo "이미 커밋된 내용과 같습니다. 그대로 배포합니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "chore(appcast): ${{ steps.target.outputs.tag }} 항목 추가"
          # main이 그사이 움직였다면 실패하는 것이 맞다. 강제로 밀지 않는다.
          git push origin HEAD:main

      - name: 요약
        run: |
          echo "### appcast 커밋됨" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 태그: ${{ steps.target.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 다음 단계: Pages 워크플로가 사이트를 배포합니다." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "배포가 끝나면 기존 사용자에게 업데이트가 알려집니다. Homebrew cask는 별도로 갱신하세요." >> "$GITHUB_STEP_SUMMARY"

  # 배포는 Pages 워크플로 하나에만 맡긴다. 여기서 직접 올리면 배포 경로가
  # 둘이 되고, 둘이 서로를 덮어쓰는 순간 업데이트 피드가 사라진다.
  pages:
    name: 사이트 배포
    needs: promote
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
