name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: SajuKit
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Build cache
        uses: actions/cache@v4
        with:
          path: SajuKit/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('SajuKit/Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Test
        working-directory: SajuKit
        run: swift test

  remote:
    name: RemoteLLM
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build cache
        uses: actions/cache@v4
        with:
          path: RemoteLLM/.build
          key: swiftpm-remote-${{ runner.os }}-${{ hashFiles('RemoteLLM/Package.swift') }}
          restore-keys: |
            swiftpm-remote-${{ runner.os }}-

      # 골든 데이터는 실제 제공자가 보낸 바이트다. 편집되면 검사가
      # 증명하는 것이 사라지므로, 테스트가 CR 유입까지 검사한다.
      - name: Test
        working-directory: RemoteLLM
        run: swift test

  app:
    name: FourEight.app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # CI에서는 컴파일 산출물까지 캐시한다. 결과가 어긋나도 비용이
      # 낮고, 키가 어긋나면 그냥 클린 빌드로 떨어진다.
      - name: Build cache
        uses: actions/cache@v4
        with:
          path: |
            build/SourcePackages
            build/Build/Intermediates.noindex
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-ci-${{ runner.os }}-${{ hashFiles('project.yml') }}-${{ github.sha }}
          restore-keys: |
            xcode-ci-${{ runner.os }}-${{ hashFiles('project.yml') }}-
            xcode-ci-${{ runner.os }}-

      - name: Build
        run: |
          xcodebuild -project FourEight.xcodeproj \
                     -scheme FourEight \
                     -configuration Debug \
                     -derivedDataPath build \
                     -skipMacroValidation \
                     -skipPackagePluginValidation \
                     CODE_SIGNING_ALLOWED=NO \
                     build

  policy:
    name: Generation policy
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # 자동 생성이 되살아나는 것을 막는다. 타입으로 못 막는 규칙은
      # 검사로 남긴다 — 주석으로만 적으면 지워진다.
      - name: Generation entry points are user actions only
        run: bash scripts/check_generation_policy.sh

      # appcast는 append-only다. 이미 나간 항목이 사라지면 그 항목을 근거로
      # 판단한 구버전 사용자를 되돌릴 방법이 없다.
      - name: Appcast is append-only and well-formed
        run: python3 scripts/check_appcast.py

  generated:
    name: Generated sources are current
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate VSOP87 tables
        run: python3 scripts/gen_vsop87.py scripts/data/VSOP87D.ear

      - name: Fail if generated output drifted
        run: |
          if ! git diff --quiet; then
            echo "Generated sources differ from committed output."
            echo "Run: python3 scripts/gen_vsop87.py scripts/data/VSOP87D.ear"
            git diff --stat
            exit 1
          fi
